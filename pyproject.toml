[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-kappa"
version = "0.0.4"
description = "PyTorch-accelerated sparse matrix condition number estimation"
readme = "README.md"
authors = [
    {name = "Erin Carson", email = "carson@karlin.mff.cuni.cz"},
    {name = "Xinye Chen", email = "xinyechenai@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "scipy>=1.7",
    "build>=0.10",
]

docs = ["sphinx>=7.0", "furo>=2024.8.6", "myst-parser>=2.0"]

[project.urls]
Homepage = "https://github.com/inEXASCALE/sparse-kappa"
Documentation = "https://sparse-kappa.readthedocs.io/en/latest/"
Repository = "https://github.com/inEXASCALE/sparse-kappa"
Issues = "https://github.com/inEXASCALE/sparse-kappa/issues"

[tool.setuptools.packages.find]
include = ["sparse_kappa", "sparse_kappa.*"]
