name: Tests and documentation

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Run regression tests
        run: python -m pytest tests -q --cov=sparse_kappa --cov-report=xml --cov-report=term
      - name: Execute self-contained examples
        run: |
          python examples/toy_models.py
          python examples/api_workflows.py
          python examples/gnn_edge_features.py --epochs 2
          python examples/gnn_edge_features.py --epochs 2 --no-edge-features
          python examples/gnn_edge_features.py --norm 1 --strategy 1 --epochs 2
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: cpu-tests
          fail_ci_if_error: false

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[docs]"
      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs/source /tmp/sparse-kappa-docs
